services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: supportpilot
      POSTGRES_PASSWORD: supportpilot
      POSTGRES_DB: supportpilot
    ports: ["5433:5432"]  # host 5433: 5432 is often taken by a local PostgreSQL install
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportpilot"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["./qdrant_storage:/qdrant/storage"]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://supportpilot:supportpilot@postgres:5432/supportpilot
      QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./models:/app/models"]
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
