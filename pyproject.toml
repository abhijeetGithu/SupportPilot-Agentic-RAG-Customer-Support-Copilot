[project]
name = "supportpilot"
version = "0.1.0"
description = "Agentic RAG customer-support copilot"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # RAG
    "llama-index-core>=0.11",
    "qdrant-client[fastembed]>=1.11",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "markdownify>=0.13",
    "tenacity>=8.5",
    # Agent + LLM providers
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=0.2",
    # Database
    "sqlalchemy>=2.0",
    "psycopg[binary,pool]>=3.2",
    # Serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "httpx>=0.27",
    # MCP + observability
    "mcp>=1.2",
    "langfuse>=2.50",
]

[project.optional-dependencies]
# torch: install the CPU wheel locally (pip install torch --index-url https://download.pytorch.org/whl/cpu)
ml = [
    "scikit-learn>=1.5",
    "transformers>=5,<6",
    "accelerate>=1.0",
    "torch>=2.3",
    "datasets>=2.20",
    "mlflow>=3.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "joblib>=1.4",
]
eval = ["ragas>=0.2", "pandas>=2.2"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
